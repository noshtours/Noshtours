    max-width: 100% !important;
    overflow-x: hidden !important;
}
.hero-video-slider, .hero-section, header, footer, [class*="hero"] {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    overflow-x: hidden !important;
}
/* Overriding inline fixed-width traps flagged in telemetry */
* { max-width: 100% !important; }
</style>
<script>
document.addEventListener("DOMContentLoaded", () => {
    // 2. CTA Sniper: Eradicate "Build your Canvas" to prevent decision fatigue
    const allElements = document.querySelectorAll('a, button, .btn');
    allElements.forEach(el => {
        if (el.textContent && el.textContent.trim().toLowerCase().includes('build your canvas')) {
            el.style.display = 'none';
            el.style.pointerEvents = 'none';
            el.style.opacity = '0';
        }
    });
});
</script>
</body>
